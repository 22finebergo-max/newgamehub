  * { margin: 0; padding: 0; box-sizing: border-box; }

    height: 100%;
    background: #0e1626;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;

    position: relative;

    line-height: 0;

  .ch-card { position:absolute; left:5%; right:5%; top:9%; bottom:9%; background:#fff; border-radius:16px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.4); }
  .ch-head { display:flex; align-items:center; gap:8px; padding:9px 12px; background:#2b4a63; color:#fff; }
  .ch-title { font-weight:900; font-size:16px; }
  .ch-badge { font-size:10px; font-weight:800; background:#43a047; border-radius:8px; padding:2px 7px; letter-spacing:.04em; }
  .ch-badge.demo { background:#8aa2b5; }
  .ch-spacer { flex:1; }
  .ch-namebtn, .ch-close { border:0; background:rgba(255,255,255,.16); color:#fff; border-radius:8px; padding:4px 8px; font-weight:800; font-size:12px; cursor:pointer; }
  .ch-list { flex:1; overflow-y:auto; padding:10px; background:#eef3f8; }
  .ch-msg { margin:0 0 10px; }

"use strict";

/* ================= SETUP ================= */
const W = 480, H = 720;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const wrap = document.getElementById("wrap");
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * DPR; canvas.height = H * DPR;

function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const w = Math.max(1, Math.floor(W * s)), h = Math.max(1, Math.floor(H * s));
  wrap.style.width = w + "px"; wrap.style.height = h + "px";
  canvas.style.width = w + "px"; canvas.style.height = h + "px";
}
window.addEventListener("resize", resize); resize();
ctx.scale(DPR, DPR);

/* ================= HELPERS ================= */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);          // cosmetic randomness
const grand = (a, b) => a + rng() * (b - a);                 // LEVEL randomness (seeded in daily)
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

let AC = null, muted = localStorage.getItem("flappyHaiderMuted") === "1" || localStorage.getItem("gamehub-sound") === "0";
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(f0, f1, dur, type, vol, delay = 0) {
  if (muted) return; const ac = audio(); if (!ac) return;
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noiseSfx(dur, vol) {
  if (muted) return; const ac = audio(); if (!ac) return;
  const t = ac.currentTime;
  const buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = ac.createBufferSource(); src.buffer = buf;
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t);
  const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
  src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t);
}

const todayKey = () => {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
};
const dateStr = () => {
  const d = new Date(), M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getDate() + " " + M[d.getMonth()];
};

/* ---- leaderboards: TODAY + ALL TIME (local top 5 each) ---- */
function boardGet(kind) { // 'all' | 'daily'
  const key = kind === "all" ? "fhTopAll" : "fhTopDaily_" + todayKey();
  try { const b = JSON.parse(localStorage.getItem(key) || "[]"); return Array.isArray(b) ? b : []; }
  catch (e) { return []; }
}
function boardSet(kind, b) {
  localStorage.setItem(kind === "all" ? "fhTopAll" : "fhTopDaily_" + todayKey(),
                       JSON.stringify(b.slice(0, 5)));
}
function boardPush(sc) {
  if (sc <= 0) return;
  const entry = { s: sc, d: dateStr(), k: todayKey(), y: dailyMode, f: dailyMode ? 1 : diffIdx };
  const all = boardGet("all"); all.push(entry); all.sort((a, b) => b.s - a.s); boardSet("all", all);
  const dl = boardGet("daily"); dl.push(entry); dl.sort((a, b) => b.s - a.s); boardSet("daily", dl);
  try { // tidy yesterdays' boards
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.startsWith("fhTopDaily_") && k !== "fhTopDaily_" + todayKey()) localStorage.removeItem(k);
    }
  } catch (e) {}
}
(function migrateOldBoard() {
  try {
    const old = JSON.parse(localStorage.getItem("flappyHaiderTop") || "[]");
    if (old.length) {
      const merged = boardGet("all").concat(old).sort((a, b) => b.s - a.s);
      boardSet("all", merged);
      localStorage.removeItem("flappyHaiderTop");
    }
  } catch (e) {}
})();
let panelTab = "daily";

function reset() {
  bird.y = H * 0.44; bird.vy = 0; bird.dead = false;
  pipes = []; powerups = []; score = 0; scorePops = [];
  shield = false; slowT = 0; x2T = 0; invuln = 0;
  spdT = 0; debris = []; smashes = 0; timesUp = false;
  timeLeft = REAL_TIME;
  flashA = 0; shake = 0;
}
function startGame(daily) {
  reset();
  if (shopHas("shieldstart")) shield = true;   // Starter Shield upgrade
  dailyMode = daily;
  realistic = !daily && MODES[modeIdx].id === "real";
  const d = daily ? DIFFS[1] : DIFFS[diffIdx];
  runDiff = d;
  PIPE_SPEED = d.speed; GAP = d.gap; PIPE_SPACING = d.spacing;
  rng = daily ? mulberry32(todayKey()) : Math.random;
  dailyBest = daily ? +(localStorage.getItem("fhDaily_" + todayKey()) || 0) : 0;
  state = "play"; stateT = 0;
  if (window.HUB) HUB.runStart();
  flap();
}
function spawnPipe() {
  const margin = 110;
  const prev = pipes[pipes.length - 1];
  const gapY = grand(margin + GAP / 2, groundY - margin - GAP / 2);
  const p = { x: W + 40, baseGapY: gapY, gapY, scored: false, mv: null };
  if (score >= runDiff.moveFrom && rng() < runDiff.moveChance)
    p.mv = { amp: grand(28, 52), sp: grand(1.4, 2.3), ph: grand(0, 6.28) };
  pipes.push(p);
  // power-up on the natural flight line between previous and new pipe
  if (powerups.length === 0 && rng() < (shopHas("lucky") ? Math.min(0.6, runDiff.pwChance * 1.6) : runDiff.pwChance)) {
    const types = realistic ? ["speed", "speed", "x2", "slow"] : ["shield", "slow", "x2", "speed"];
    const flightY = prev ? (prev.gapY + gapY) / 2 : gapY;
    powerups.push({
      x: p.x - PIPE_SPACING / 2,
      y: clamp(flightY, 90, groundY - 90),
      type: types[(rng() * types.length) | 0],
      ph: grand(0, 6.28),
    });
  }
}
function flap() {
  bird.vy = FLAP_V;
  sfx.flap();
  if (window.HUB) HUB.vibe("flap");
  for (let i = 0; i < 3; i++)
    scorePops.push({ x: bird.x - 14, y: bird.y + 10, vx: rand(-40, -15), vy: rand(20, 60), a: 0.8, s: rand(2, 3.5), feather: true });
}
function collect(pu) {
  sfx.power();
  const label = pu.type === "shield" ? "SHIELD" : pu.type === "slow" ? "SLOW-MO"
    : pu.type === "speed" ? "SPEED UP!" : "2x SCORE";
  scorePops.push({ x: pu.x, y: pu.y - 24, a: 1, s: 15, text: label });
  if (window.HUB) HUB.vibe("power");
  if (pu.type === "shield") shield = true;
  else if (pu.type === "slow") slowT = SLOW_DUR;
  else if (pu.type === "speed") { spdT = SPEED_DUR; flashA = Math.max(flashA, 0.25); shake = Math.max(shake, 7); }
  else x2T = X2_DUR;
}
/* smashing a pipe in Realistic mode */
function smashPipe(p) {
  p.smashed = true;
  p.mv = null;
  // the two halves get knocked loose and tumble away off the screen
  p.half = {
    top: { dx: 0, dy: 0, rot: 0, vx: rand(10, 90), vy: rand(-260, -120), vr: rand(-3.2, -1.1) },
    bot: { dx: 0, dy: 0, rot: 0, vx: rand(20, 120), vy: rand(-90, 40), vr: rand(1.1, 3.2) }
  };
  smashes++;
  if (!p.scored) { p.scored = true; score += x2T > 0 ? 2 : 1; }
  score += x2T > 0 ? 2 : 1;
  shake = Math.max(shake, 13);
  flashA = Math.max(flashA, 0.3);
  sfx.hit();
  if (window.HUB) HUB.vibe("score");
  scorePops.push({ x: bird.x + 10, y: bird.y - 30, a: 1, s: 20, text: "SMASH!" });
  for (let i = 0; i < 12; i++) {
    debris.push({
      x: p.x + Math.random() * PIPE_W,
      y: Math.random() < 0.5 ? rand(0, p.gapY - GAP / 2) : rand(p.gapY + GAP / 2, groundY),
      vx: rand(-40, 190), vy: rand(-220, 120),
      s: rand(7, 17), rot: rand(0, 6.28), vr: rand(-9, 9), a: 1
    });
  }
}
function addXP(n) {
  const before = levelOf(xpTotal);
  xpTotal += n;
  localStorage.setItem("flappyHaiderXP", xpTotal);
  if (levelOf(xpTotal) > before) {
    scorePops.push({ x: W / 2, y: H * 0.3, a: 1.6, s: 30, text: "LEVEL " + levelOf(xpTotal) + "!" });
    flashA = Math.max(flashA, 0.3);
    sfx.levelup();
  }
}
function die() {
  if (state === "dying" || state === "over") return;
  state = "dying"; stateT = 0;
  shake = timesUp ? 6 : 26; flashA = timesUp ? 0.25 : 0.75;
  if (timesUp) scorePops.push({ x: W / 2, y: H * 0.34, a: 1.6, s: 30, text: "TIME!" });
  if (window.HUB) HUB.vibe("crash");
  for (let i = 0; i < 22; i++) {
    const a = rand(0, 6.283), sp = rand(40, 190);
    scorePops.push({ x: bird.x + rand(-8, 8), y: bird.y + rand(-8, 8),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
      a: rand(0.7, 1.2), s: rand(2, 5), feather: true });
  }
  panelTab = "daily";
  sfx.hit();
  // award XP & celebrate level ups
  addXP(score * XP_PER_POINT);
  // coins: rate depends on run difficulty (Easy 50 / Med 20 / Hard 5 points per coin)
  const earned = Math.floor(score / (runDiff.coins || 20));
  if (earned > 0) {
    coinsTotal += earned;
    localStorage.setItem("flappyHaiderCoins", coinsTotal);
    scorePops.push({ x: W / 2, y: H * 0.2, a: 1.4, s: 19, text: "+" + earned + (earned === 1 ? " COIN" : " COINS") });
  }
  if (realistic) {
    if (score > bestReal) { bestReal = score; localStorage.setItem("flappyHaiderBestReal", bestReal); }
  } else if (score > best) { best = score; localStorage.setItem("flappyHaiderBest", best); }
  if (dailyMode && score > dailyBest) {
    dailyBest = score;
    localStorage.setItem("fhDaily_" + todayKey(), dailyBest);
  }
  if (!realistic) boardPush(score);
  if (window.HUB) HUB.gameOver(score, realistic ? bestReal : best,
    { diff: (runDiff && runDiff.name) || "", daily: dailyMode, mode: realistic ? "REALISTIC" : "" , smashes: smashes });
}
function press() {
  audio();
  if (state === "play") flap();
  else if (state === "ready") startGame(false);
  else if (state === "over" && stateT > 0.6) { reset(); state = "ready"; stateT = 0; sfx.whoosh(); }
}

/* ================= CHAT ================= */
/* To make chat truly GLOBAL: create a free Firebase project, paste its web config
   object below and set database rules from SETUP.md. Without it, chat runs in a
   local demo mode on this device only. */
const FIREBASE_CONFIG = null;

const CHAT = {
  open: false, built: false, sending: 0,
  name: (localStorage.getItem("flappyHaiderName") || ""),
  uid: localStorage.getItem("flappyHaiderUid") || (Math.random().toString(16).slice(2, 10) + Date.now().toString(16)),
  msgs: [], byId: new Set(),
  fb: { tried: false, ready: false, fail: false, db: null, m: null },
  el: {},
};
if (!localStorage.getItem("flappyHaiderUid")) localStorage.setItem("flappyHaiderUid", CHAT.uid);
const CHAT_KEY = "fhChatMsgs", CHAT_MAX = 100, CHAT_PATH = "flappyHaider/chat";

function chatSetName(n) {
  n = String(n || "").trim().slice(0, 16);
  if (!n) return false;
  CHAT.name = n;
  localStorage.setItem("flappyHaiderName", n);
  return true;
}
function chatSaveLocal() {
  try { localStorage.setItem(CHAT_KEY, JSON.stringify(CHAT.msgs.slice(-CHAT_MAX))); } catch (e) {}
}
function chatLoadLocal() {
  try {
    const a = JSON.parse(localStorage.getItem(CHAT_KEY) || "[]");
    if (Array.isArray(a)) a.forEach(chatIngest);
  } catch (e) {}
}
function chatIngest(m) {
  if (!m || !m.id || CHAT.byId.has(m.id)) return;
  if (typeof m.ts !== "number") m.ts = Date.now();
  CHAT.byId.add(m.id);
  CHAT.msgs.push(m);
  CHAT.msgs.sort((a, b) => (a.ts || 0) - (b.ts || 0));
  while (CHAT.msgs.length > CHAT_MAX) {
    const cut = CHAT.msgs.splice(0, CHAT.msgs.length - CHAT_MAX);
    cut.forEach(x => CHAT.byId.delete(x.id));
  }
}
function chatDrop(id) {
  CHAT.byId.delete(id);
  CHAT.msgs = CHAT.msgs.filter(m => m.id !== id);
}
async function chatBackend() {
  if (CHAT.fb.tried) return;
  CHAT.fb.tried = true;
  chatLoadLocal();
  if (!CHAT.fb.ready && CHAT.msgs.length === 0) {
    chatIngest({ id: "sys0", uid: "__", name: "System", lv: 30,
      text: "Local demo mode. Connect Firebase for global chat — see SETUP.md", ts: Date.now() });
  }
  if (!FIREBASE_CONFIG) { chatRender(); return; }
  try {
    const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const dbMod  = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    CHAT.fb.db = dbMod.getDatabase(app);
    CHAT.fb.m = dbMod;
    CHAT.fb.ready = true;
    // switch from local demo to the global feed
    CHAT.msgs = []; CHAT.byId.clear();
    const q = dbMod.query(dbMod.ref(CHAT.fb.db, CHAT_PATH), dbMod.limitToLast(CHAT_MAX));
    dbMod.onChildAdded(q, s => { const v = s.val() || {}; v.id = s.key; chatIngest(v); chatRender(); });
    dbMod.onChildRemoved(q, s => { chatDrop(s.key); chatRender(); });
  } catch (e) { CHAT.fb.fail = true; }
  chatRender();
}
function chatSend(text) {
  text = String(text || "").trim();
  const now = Date.now();
  if (!CHAT.name || !text || now - CHAT.sending < 1200) return false;
  CHAT.sending = now;
  const m = { uid: CHAT.uid, name: CHAT.name, lv: levelOf(xpTotal), text: text.slice(0, 120), ts: now };
  if (CHAT.fb.ready) {
    CHAT.fb.m.push(CHAT.fb.m.ref(CHAT.fb.db, CHAT_PATH), m).then(() => sfx.point()).catch(() => {});
  } else {
    m.id = "m" + now.toString(36) + Math.random().toString(16).slice(2, 6);
    chatIngest(m); chatSaveLocal(); chatRender(); sfx.point();
  }
  return true;
}
function chatDelete(id) {
  const m = CHAT.msgs.find(x => x.id === id);
  if (!m || m.uid !== CHAT.uid) return false;
  if (CHAT.fb.ready) {
    CHAT.fb.m.remove(CHAT.fb.m.ref(CHAT.fb.db, CHAT_PATH + "/" + id)).catch(() => {});
  } else {
    chatDrop(id); chatSaveLocal(); chatRender();
  }
  return true;
}
function fmtTime(ts) { return new Date(ts || Date.now()).toTimeString().slice(0, 5); }

function chatBuild() {
  if (CHAT.built) return;
  CHAT.built = true;
  const ov = document.createElement("div");
  ov.id = "chatOverlay";
  ov.addEventListener("pointerdown", e => e.stopPropagation());
  ov.innerHTML =
    '<div class="ch-card">' +
      '<div class="ch-head">' +
        '<span class="ch-title">\u{1F4AC} Chat</span>' +
        '<span class="ch-badge demo" id="chBadge">DEMO</span>' +
        '<span class="ch-spacer"></span>' +
        '<button class="ch-namebtn" id="chName" title="change name"></button>' +
        '<button class="ch-close" id="chClose">\u2715</button>' +
      '</div>' +
      '<div class="ch-list" id="chList"></div>' +
      '<div class="ch-row"><input id="chInput" maxlength="120" placeholder="Message\u2026" autocomplete="off"><button id="chSend">SEND</button></div>' +
      '<div class="ch-namewrap" id="chNameWrap" style="display:none;flex:1;">' +
        '<div style="font-weight:900;font-size:18px;color:#2b4a63;margin:18px 0 4px;">Welcome to chat!</div>' +
        '<div style="color:#56718a;font-size:13px;margin-bottom:14px;">Pick a name — shown next to your messages and level.</div>' +
        '<div style="display:flex;gap:6px;justify-content:center;">' +
          '<input id="chNameInput" maxlength="16" placeholder="Your name" autocomplete="off" style="border:1px solid #c7d5e0;border-radius:9px;padding:9px 10px;font-size:15px;font-family:inherit;width:60%;">' +
          '<button id="chNameSave" style="border:0;background:#ff7043;color:#fff;font-weight:900;border-radius:9px;padding:9px 16px;cursor:pointer;">GO</button>' +
        '</div></div>' +
    '</div>';
  document.getElementById("wrap").appendChild(ov);
  const E = CHAT.el = {
    ov, badge: ov.querySelector("#chBadge"), list: ov.querySelector("#chList"),
    input: ov.querySelector("#chInput"), sendBtn: ov.querySelector("#chSend"),
    nameBtn: ov.querySelector("#chName"), closeBtn: ov.querySelector("#chClose"),
    nameWrap: ov.querySelector("#chNameWrap"), nameInput: ov.querySelector("#chNameInput"),
    nameSave: ov.querySelector("#chNameSave"),
  };
  E.closeBtn.addEventListener("click", closeChat);
  E.sendBtn.addEventListener("click", () => { if (chatSend(E.input.value)) { E.input.value = ""; E.input.focus(); } });
  E.input.addEventListener("keydown", e => {
    e.stopPropagation();
    if (e.key === "Enter") { if (chatSend(E.input.value)) { E.input.value = ""; } }
  });
  E.nameSave.addEventListener("click", () => {
    if (chatSetName(E.nameInput.value)) { E.nameWrap.style.display = "none"; chatRender(); E.input.focus(); }
  });
  E.nameInput.addEventListener("keydown", e => {
    e.stopPropagation();
    if (e.key === "Enter" && chatSetName(E.nameInput.value)) { E.nameWrap.style.display = "none"; chatRender(); }
  });
  E.nameBtn.addEventListener("click", () => {
    E.nameInput.value = CHAT.name;
    E.nameWrap.style.display = "block";
    E.nameInput.focus();
  });
}
function chatRender() {
  if (!CHAT.built) return;
  const E = CHAT.el;
  E.badge.textContent = CHAT.fb.ready ? "GLOBAL" : "LOCAL DEMO";
  E.badge.className = "ch-badge" + (CHAT.fb.ready ? "" : " demo");
  E.nameBtn.textContent = "\u270F " + (CHAT.name || "set name");
  if (!CHAT.name) { E.nameWrap.style.display = "block"; }
  const list = E.list;
  list.innerHTML = "";
  if (CHAT.msgs.length === 0) {
    const d = document.createElement("div");
    d.className = "ch-sys";
    d.textContent = "No messages yet — say hi!";
    list.appendChild(d);
  }
  for (const m of CHAT.msgs) {
    const own = m.uid === CHAT.uid;
    const row = document.createElement("div");
    row.className = "ch-msg" + (own ? " own" : "");
    const meta = document.createElement("div");
    meta.className = "ch-meta";
    const nm = document.createElement("span"); nm.className = "ch-nm"; nm.textContent = m.name || "?";
    const lv = document.createElement("span"); lv.className = "ch-lv"; lv.textContent = "Lv " + (m.lv || 1);
    const tm = document.createElement("span"); tm.className = "ch-time"; tm.textContent = fmtTime(m.ts);
    meta.appendChild(nm); meta.appendChild(lv); meta.appendChild(tm);
    if (own) {
      const del = document.createElement("button");
      del.className = "ch-del"; del.title = "delete"; del.textContent = "\u{1F5D1}";
      del.addEventListener("click", () => chatDelete(m.id));
      meta.appendChild(del);
    }
    const bub = document.createElement("div");
    bub.className = "ch-bub"; bub.textContent = m.text;
    row.appendChild(meta); row.appendChild(bub);
    list.appendChild(row);
  }
  list.scrollTop = list.scrollHeight;
}
function openChat() {
  chatBuild();
  CHAT.open = true;
  CHAT.el.ov.style.display = "block";
  chatBackend();
  chatRender();
  if (CHAT.name) chatRender();
  sfx.whoosh();
}
function closeChat() {
  CHAT.open = false;
  if (CHAT.built) CHAT.el.ov.style.display = "none";
}

/* ================= TIC TAC TOE (You=X vs AI=O) ================= */
const TTT_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const TTT = { b: Array(9).fill(""), over: false, result: null, line: null, thinking: false, thinkAt: 0 };

function tttWinner(b) {
  for (const L of TTT_LINES) {
    const [a, c, d] = L;
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return { who: b[a], line: L };
  }
  return b.every(Boolean) ? { who: "D", line: null } : null;
}
function tttReset() {
  TTT.b = Array(9).fill("");
  TTT.over = false; TTT.result = null; TTT.line = null; TTT.thinking = false;
}
function tttFinish(w) {
  TTT.over = true; TTT.line = w.line;
  if (w.who === "X") {
    TTT.result = "win";
    addXP(25);
    scorePops.push({ x: W / 2, y: 240, a: 1.4, s: 20, text: "+25 XP" });
    sfx.levelup();
  } else if (w.who === "O") { TTT.result = "lose"; sfx.hit(); }
  else { TTT.result = "draw"; addXP(5); sfx.whoosh(); }
}
function tttTap(i) {
  if (TTT.over || TTT.thinking || TTT.b[i]) return;
  TTT.b[i] = "X"; sfx.flap();
  const w = tttWinner(TTT.b);
  if (w) { tttFinish(w); return; }
  TTT.thinking = true; TTT.thinkAt = t + 0.55;
}
function tttAiMove() {
  const b = TTT.b;
  const free = b.map((v, i) => v ? -1 : i).filter(i => i >= 0);
  if (!free.length) return;
  const completes = who => {
    for (const i of free) {
      const c = b.slice(); c[i] = who;
      const w = tttWinner(c);
      if (w && w.who === who) return i;
    }
    return -1;
  };
  let pick = completes("O");            // 1) take the win
  if (pick < 0) pick = completes("X");  // 2) block player's win
  if (pick < 0) {                        // 3) centre, corners, sides
    const pref = [4, 0, 2, 6, 8, 1, 3, 5, 7];
    pick = pref.find(i => free.includes(i));
  }
  b[pick] = "O"; sfx.point();
  const w = tttWinner(b);
  if (w) tttFinish(w);
}
function tttGeom() { const cell = 112, size = cell * 3; return { bx: W / 2 - size / 2, by: 246, cell, size }; }

function drawPhotoCircle(x, y, r, photo, ready, stops) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = "rgba(15,35,50,0.22)";
  ctx.beginPath(); ctx.arc(1.5, 3, r + 3, 0, 7); ctx.fill();
  const g = ctx.createRadialGradient(-r * 0.4, -r * 0.5, r * 0.2, 0, 0, r * 1.2);
  for (const s of stops) g.addColorStop(s[0], s[1]);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, 7); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.clip();
  if (ready) ctx.drawImage(photo, -r, -r, r * 2, r * 2);
  else { ctx.fillStyle = "#dfe9f0"; ctx.fillRect(-r, -r, r * 2, r * 2); }
  const inner = ctx.createRadialGradient(-r * 0.5, -r * 0.6, r * 0.3, 0, 0, r * 1.3);
  inner.addColorStop(0, "rgba(255,255,255,0.3)");
  inner.addColorStop(0.55, "rgba(255,255,255,0)");
  inner.addColorStop(1, "rgba(0,0,0,0.2)");
  ctx.fillStyle = inner;
  ctx.fillRect(-r, -r, r * 2, r * 2);
  ctx.restore();
  ctx.strokeStyle = "rgba(60,35,5,0.45)"; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  ctx.restore();
}
function tttBtnIcon(x, y, s) {
  if (faceReady) drawPhotoCircle(x + s * 0.36, y + s * 0.5, s * 0.24, faceImg, true, SKINS[0].stops);

}

function drawTTT() {
  const z = tttZones(), g = z.g;
  ctx.save();
  ctx.fillStyle = "rgba(10,25,40,0.35)"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,255,255,0.95)";
  rr(W / 2 - 178, 112, 356, 580, 24); ctx.fill();
  ctx.strokeStyle = "rgba(20,50,80,0.15)"; ctx.lineWidth = 2;
  rr(W / 2 - 178, 112, 356, 580, 24); ctx.stroke();

  ctx.textAlign = "center";
  ctx.fillStyle = "#2b4a63"; ctx.font = '900 32px "Trebuchet MS", sans-serif';
  ctx.fillText("Tic Tac Toe", W / 2, 160);

  ctx.fillStyle = "rgba(40,70,95,0.45)";
  rr(z.quit.x, z.quit.y, z.quit.w, z.quit.h, 10); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = '800 16px "Trebuchet MS", sans-serif';
  ctx.fillText("\u2715", z.quit.x + z.quit.w / 2, z.quit.y + 21);

  // vs row: you (X face) vs AI (O face)
  drawPhotoCircle(W / 2 - 62, 200, 15, faceImg, faceReady, SKINS[0].stops);
  drawPhotoCircle(W / 2 + 62, 200, 15, faceImg2, face2Ready, SKINS[4].stops);
  ctx.fillStyle = "#35516a"; ctx.font = '900 16px "Trebuchet MS", sans-serif';
  ctx.fillText("VS", W / 2, 206);
  ctx.fillStyle = "#56718a"; ctx.font = '800 12px "Trebuchet MS", sans-serif';
  ctx.fillText("YOU · X", W / 2 - 62, 234);
  ctx.fillText("AI · O", W / 2 + 62, 234);

  // grid
  ctx.strokeStyle = "#35516a"; ctx.lineWidth = 6; ctx.lineCap = "round";
  for (let i = 1; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(g.bx + i * g.cell, g.by + 10); ctx.lineTo(g.bx + i * g.cell, g.by + g.size - 10);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(g.bx + 10, g.by + i * g.cell); ctx.lineTo(g.bx + g.size - 10, g.by + i * g.cell);
    ctx.stroke();
  }

  // pieces
  for (let i = 0; i < 9; i++) {
    const v = TTT.b[i]; if (!v) continue;
    const cx = g.bx + (i % 3) * g.cell + g.cell / 2;
    const cy = g.by + Math.floor(i / 3) * g.cell + g.cell / 2;
    if (v === "X") drawPhotoCircle(cx, cy, 40, faceImg, faceReady, SKINS[0].stops);

  // winning line

    ctx.lineWidth = 9; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
  }

  // status / result
  if (TTT.over) {
    const conf = TTT.result === "win" ? ["#43a047", "You win!   +25 XP"]
              : TTT.result === "lose" ? ["#e53935", "AI wins!"]
              : ["#8aa2b5", "It's a draw!   +5 XP"];
    ctx.fillStyle = conf[0];
    rr(W / 2 - 150, 592, 300, 38, 19); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = '900 18px "Trebuchet MS", sans-serif';
    ctx.fillText(conf[1], W / 2, 617);
    drawTTTBtn(z.again, "#ff7043", TTT.result === "win" ? "Play again" : "Try again");
    drawTTTBtn(z.menu, "#8aa2b5", "Menu");
  } else {
    ctx.fillStyle = "#56718a"; ctx.font = '800 16px "Trebuchet MS", sans-serif';
    ctx.fillText(TTT.thinking ? "AI is thinking\u2026" : "Your turn \u2014 tap a square", W / 2, 617);
  }
  ctx.restore();
}

/* ================= DUNKY HAIDER (Flappy Dunk game mode) ================= */
/* A whole second game: the basketball is Haider. Tap to flap up, drop him
   down through every hoop. Clean swishes build a combo up to x4 — rim, wall,
   the court floor or a missed hoop ends the run. */
let scene = "flappy";              // "flappy" | "dunky"
const DK_FLOOR = 88;
const dkCourtY = H - DK_FLOOR;
const DK_GRAV = 1950, DK_FLAP = -520, DK_MAXFALL = 920, DK_BALL_X = 122;
const dk = {
  st: "ready", stT: 0, reason: "",
  score: 0, best: +(localStorage.getItem("dunkyHaiderBest") || 0),
  combo: 1, comboMax: 1, comboBest: +(localStorage.getItem("dunkyHaiderCombo") || 1),
  ball: { x: DK_BALL_X, y: 300, vy: 0, r: 21 },
  rot: 0, speed: 150, scroll: 0, courtOff: 0,
  gates: [], flames: [],
};
function dkMenuRect() { return { x: W / 2 - 130, y: 472, w: 260, h: 44 }; }
function dkOverMenuRect() {
  const ph = 322, py = H * 0.5 - ph / 2 - 10;
  return { x: W / 2 - 110, y: py + ph + 66, w: 220, h: 42 };
}
function dunkyEnter() {
  scene = "dunky";
  dk.st = "ready"; dk.stT = 0;
  state = "ready"; stateT = 0;
  if (CHAT.open) closeChat();
  if (window.HUB) HUB.runStart();
  sfx.whoosh();
}
function dunkyExit() {
  scene = "flappy";
  reset(); state = "ready"; stateT = 0;
  sfx.whoosh();
}
function dFlap() {
  dk.ball.vy = DK_FLAP;
  dk.rot -= 0.5;
  sfx.flap();
  if (window.HUB) HUB.vibe("flap");
  for (let i = 0; i < 2; i++)
    scorePops.push({ x: dk.ball.x - 12, y: dk.ball.y + 12, vx: rand(-40, -15), vy: rand(20, 60), a: 0.7, s: rand(2, 3), feather: true });
}
function dkSpawnGate() {
  const prev = dk.gates[dk.gates.length - 1];
  const x = prev ? W + 40 + rand(0, 26) : W + 210;
  let rimY = rand(150, dkCourtY - 170);
  if (prev) rimY = clamp(rimY, prev.rimY - 170, prev.rimY + 170);
  rimY = clamp(rimY, 150, dkCourtY - 170);
  dk.gates.push({
    x, w: 72, rimY,
    rimX0: x - 84, rimX1: x,
    scored: false, rimmed: false, hitCd: 0, netT: 0, sway: rand(0, 6.28),
  });
}
function dkStart() {
  dk.st = "play"; dk.stT = 0; dk.reason = "";
  dk.score = 0; dk.combo = 1; dk.comboMax = 1;
  dk.speed = 150;
  dk.ball.x = DK_BALL_X; dk.ball.y = 300; dk.ball.vy = 0;
  dk.gates = []; dk.flames = [];
  dkSpawnGate();
  if (window.HUB) HUB.runStart();
  dFlap();
}
function dDie(reason) {
  if (dk.st !== "play") return;
  dk.st = "over"; dk.stT = 0; dk.reason = reason;
  shake = 22; flashA = 0.55;
  sfx.hit();
  if (window.HUB) HUB.vibe("crash");
  for (let i = 0; i < 18; i++) {
    const a = rand(0, 6.283), sp = rand(40, 180);
    scorePops.push({ x: dk.ball.x + rand(-8, 8), y: dk.ball.y + rand(-8, 8),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
      a: rand(0.7, 1.1), s: rand(2, 4.5), feather: true });
  }
  addXP(dk.score * XP_PER_POINT);
  const earned = Math.floor(dk.score / 20);
  if (earned > 0) {
    coinsTotal += earned;
    localStorage.setItem("flappyHaiderCoins", coinsTotal);
    scorePops.push({ x: W / 2, y: H * 0.2, a: 1.4, s: 19, text: "+" + earned + (earned === 1 ? " COIN" : " COINS") });
  }
  if (dk.score > dk.best) { dk.best = dk.score; localStorage.setItem("dunkyHaiderBest", dk.best); }
  if (dk.comboMax > dk.comboBest) { dk.comboBest = dk.comboMax; localStorage.setItem("dunkyHaiderCombo", dk.comboBest); }
  if (window.HUB) HUB.gameOver(dk.score, dk.best, { mode: "DUNKY", combo: dk.comboBest });
}
function dunkyTap(p) {
  audio();
  const inRect = (pt, r) => pt && Math.abs(pt.x - (r.x + r.w / 2)) < r.w / 2 + 4 && Math.abs(pt.y - (r.y + r.h / 2)) < r.h / 2 + 4;
  if (dk.st === "ready") {
    if (inRect(p, dkMenuRect())) { dunkyExit(); return; }
    dkStart();
  } else if (dk.st === "play") {
    dFlap();
  } else {
    if (inRect(p, dkOverMenuRect())) { dunkyExit(); return; }
    if (dk.stT > 0.6) dkStart();
  }
}
function dunkyUpdate(dt) {
  dk.stT += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 34);
  if (flashA > 0) flashA = Math.max(0, flashA - dt * 1.4);
  const scrollSpeed = dk.st === "play" ? dk.speed : 30;
  groundScroll = (groundScroll + scrollSpeed * dt) % 48;
  hillScroll = (hillScroll + scrollSpeed * 0.35 * dt) % 240;
  mtnScroll = (mtnScroll + scrollSpeed * 0.12 * dt) % 360;
  dk.courtOff = (dk.courtOff + scrollSpeed * dt) % 44;
  for (const c of clouds) { c.x -= c.v * dt * (dk.st === "play" ? 1.6 : 1); if (c.x < -140) { c.x = W + rand(20, 140); c.y = 40 + Math.random() * 260; c.s = 0.5 + Math.random() * 0.65; } }
  for (const s of seeds) { s.x -= s.v * dt; s.ph += dt; if (s.x < -8) { s.x = W + 8; s.y = 60 + Math.random() * (groundY - 60); } }
  for (const p of scorePops) {
    if (p.feather) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.a -= dt * 1.6; }
    else { p.y -= 46 * dt; p.a -= dt * 1.1; p.s += dt * 12; }
  }
  scorePops = scorePops.filter(p => p.a > 0);
  for (const f of dk.flames) { f.x += f.vx * dt; f.y += f.vy * dt; f.a -= dt * 2.6; f.s *= 0.985; }
  dk.flames = dk.flames.filter(f => f.a > 0);
  dk.rot += dt * 6;

  if (dk.st === "ready") {
    dk.ball.x = DK_BALL_X;
    dk.ball.y = 386 - Math.abs(Math.sin(t * 2.4)) * 74;
    dk.ball.vy = 0;
    return;
  }
  if (dk.st !== "play") return;

  const b = dk.ball, py = b.y;
  b.vy = Math.min(DK_MAXFALL, b.vy + DK_GRAV * dt);
  b.y += b.vy * dt;
  b.x += (DK_BALL_X - b.x) * Math.min(1, dt * 5);

  if (b.y - b.r < 0) { b.y = b.r; b.vy = 0; }
  if (b.y + b.r >= dkCourtY) { b.y = dkCourtY - b.r; dDie("OUT OF BOUNDS!"); return; }

  for (const g of dk.gates) {
    g.x -= dk.speed * dt; g.rimX0 -= dk.speed * dt; g.rimX1 -= dk.speed * dt;
    if (g.hitCd > 0) g.hitCd -= dt;
    if (g.netT > 0) g.netT -= dt * 2.3;
    if (!g.scored && g.x + g.w < b.x - b.r - 2) { dDie("MISSED THE HOOP!"); return; }
  }
  dk.gates = dk.gates.filter(g => g.x + g.w > -100);
  if (dk.gates.length === 0 || dk.gates[dk.gates.length - 1].x < W - 300) dkSpawnGate();

  for (const g of dk.gates) {
    /* ceiling block */
    const ry1 = g.rimY - 24;
    const cx = clamp(b.x, g.x, g.x + g.w), cy = clamp(b.y, -50, ry1);
    if (!g.scored && (b.x - cx) ** 2 + (b.y - cy) ** 2 < b.r * b.r * 0.92) { dDie("CLANG!"); return; }
    /* rim tubes: bouncy */
    if (g.hitCd <= 0) {
      for (const tube of [[g.rimX0 + 4, g.rimY], [g.rimX1 - 4, g.rimY]]) {
        const dx = b.x - tube[0], dy = b.y - tube[1], d2 = dx * dx + dy * dy, rr2 = (b.r + 5.5) ** 2;
        if (d2 >= rr2) continue;
        g.rimmed = true; g.hitCd = 0.14;
        const d = Math.sqrt(d2) || 1, nx = dx / d, ny = dy / d;
        const vn = dk.speed * nx + b.vy * ny;
        if (vn < 0) b.vy -= 1.72 * vn * ny;
        b.x += nx * 2.5; b.y += ny * 2.5;
        tone(320, 170, 0.07, "triangle", 0.10);
        break;
      }
    }
    /* through the hoop? */
    const half = (g.rimX1 - g.rimX0) / 2, cxm = g.rimX0 + half;
    const within = b.x > g.rimX0 + 7 && b.x < g.rimX1 - 7;
    if (!g.scored && within) {
      if (py < g.rimY && b.y >= g.rimY && b.vy > 0) {
        g.scored = true; g.netT = 1;
        const clean = !g.rimmed && Math.abs(b.x - cxm) <= (half - 8) * 0.62;
        let pts;
        if (clean) {
          pts = Math.min(4, dk.combo);
          dk.comboMax = Math.max(dk.comboMax, Math.min(4, dk.combo));
          dk.combo = Math.min(4, dk.combo + 1);
          noiseSfx(0.22, 0.10); tone(880, 1320, 0.09, "sine", 0.10, 0.02);
          flashA = Math.max(flashA, 0.12);
        } else {

    if (Math.abs(p.x - W / 2) < Z.dailyW / 2 && Math.abs(p.y - Z.dailyY) < Z.dailyH / 2) { audio(); startGame(true); return; }
    if (Math.abs(p.x - W / 2) < Z.dunkyW / 2 + 4 && Math.abs(p.y - Z.dunkyY) < Z.dunkyH / 2 + 4) { audio(); dunkyEnter(); return; }

/* ================= UPDATE ================= */
function update(dt) {
  t += dt; stateT += dt;
  if (scene === "dunky") { dunkyUpdate(dt); return; }
  if (shake > 0) shake = Math.max(0, shake - dt * 34);
  if (flashA > 0) flashA = Math.max(0, flashA - dt * 1.4);
  if (invuln > 0) invuln = Math.max(0, invuln - dt);
  if (slowT > 0) slowT = Math.max(0, slowT - dt);
  if (x2T > 0) x2T = Math.max(0, x2T - dt);
  if (spdT > 0) spdT = Math.max(0, spdT - dt);
  if (debris.length) {
    for (const d of debris) {
      d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 900 * dt;
      d.rot += d.vr * dt; d.a -= dt * 0.9;
    }
    debris = debris.filter(d => d.a > 0 && d.y < H + 40);
  }
  if (realistic && state === "play") {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0 && !timesUp) { timesUp = true; die(); }
  }

  const worldScale = (slowT > 0 ? SLOW_AMT : 1) * (spdT > 0 ? SPEED_AMT : 1)
    * (realistic ? 1.15 : 1) * (shopHas("headstart") && score < 3 ? 0.55 : 1); // Head Start upgrade
  const scrollSpeed = state === "play" ? PIPE_SPEED * worldScale : (state === "ready" ? 40 : 0);
  groundScroll = (groundScroll + scrollSpeed * dt) % 48;
  hillScroll = (hillScroll + scrollSpeed * 0.35 * dt) % 240;
  mtnScroll = (mtnScroll + scrollSpeed * 0.12 * dt) % 360;

  for (const c of clouds) { c.x -= c.v * dt * (state === "play" ? 1.6 : 1) * worldScale; if (c.x < -140) { c.x = W + rand(20, 140); c.y = 40 + Math.random() * 260; c.s = 0.5 + Math.random() * 0.65; } }
  for (const s of seeds) { s.x -= s.v * dt * worldScale; s.ph += dt; if (s.x < -8) { s.x = W + 8; s.y = 60 + Math.random() * (groundY - 60); } }

  for (const p of scorePops) {
    if (p.feather) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.a -= dt * 1.6; }
    else { p.y -= 46 * dt; p.a -= dt * 1.1; p.s += dt * 12; }
  }
  scorePops = scorePops.filter(p => p.a > 0);

  if (state === "ready") {
    bird.y = H * 0.44 + Math.sin(t * 3) * 9;
  } else if (state === "play" || state === "dying") {
    bird.vy += GRAV * dt;
    if (bird.vy > MAX_FALL) bird.vy = MAX_FALL;
    bird.y += bird.vy * dt;

    if (state === "play") {
      const spd = PIPE_SPEED * worldScale;
      if (pipes.length === 0 || pipes[pipes.length - 1].x < W - PIPE_SPACING) spawnPipe();
      for (const p of pipes) {
        p.x -= spd * dt;
        if (p.smashed) {
          for (const h of [p.half.top, p.half.bot]) {
            h.vy += 1150 * dt;
            h.dx += h.vx * dt; h.dy += h.vy * dt;
            h.rot += h.vr * dt;
          }
          continue;
        }
        if (p.mv)
          p.gapY = clamp(p.baseGapY + Math.sin(t * p.mv.sp + p.mv.ph) * p.mv.amp,
                         110 + GAP / 2, groundY - 110 - GAP / 2);
        if (!p.scored && p.x + PIPE_W < bird.x) {
          p.scored = true;
          const pts = x2T > 0 ? 2 : 1;
          score += pts;
          if (window.HUB) HUB.vibe("score");
          scorePops.push({ x: bird.x + 34, y: bird.y - 26, a: 1, s: 18, text: "+" + pts });
          sfx.point();
        }
      }
      pipes = pipes.filter(p => p.smashed
        ? (p.x + p.half.top.dx > -PIPE_W - 400 && Math.min(p.half.top.dy, p.half.bot.dy) < H + 400)
        : p.x > -PIPE_W - 20);

      for (const pu of powerups) pu.x -= spd * dt;
      powerups = powerups.filter(pu => {
        if (pu.x < -30) return false;
        if (Math.hypot(bird.x - pu.x, bird.y - pu.y) < bird.r + 17) { collect(pu); return false; }
        return true;
      });

      if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }

      if (invuln <= 0) {
        for (const p of pipes) {
          if (p.smashed) continue;
          if (bird.x + bird.r < p.x || bird.x - bird.r > p.x + PIPE_W) continue;
          const topBot = p.gapY - GAP / 2, botTop = p.gapY + GAP / 2;
          const hitRect = (ry0, ry1) => {
            const cx = clamp(bird.x, p.x, p.x + PIPE_W);
            const cy = clamp(bird.y, ry0, ry1);
            return (bird.x - cx) ** 2 + (bird.y - cy) ** 2 < bird.r * bird.r;
          };
          if (hitRect(-50, topBot) || hitRect(botTop, H)) {
            if (realistic) { smashPipe(p); continue; }
            if (shield) {
              shield = false; invuln = 1.4; shake = 10; flashA = 0.35;
              sfx.shieldBreak();
              scorePops.push({ x: bird.x, y: bird.y - 34, a: 1, s: 14, text: "SHIELD SAVED YOU" });
            } else { die(); break; }
          }
        }
      }
    }
    if (bird.y + bird.r >= groundY) {
      bird.y = groundY - bird.r;
      if (state === "play") die();
      if (state === "dying") { state = "over"; stateT = 0; sfx.whoosh(); }
      bird.vy = 0; bird.dead = true;
    }
  }
  if (state === "ttt" && TTT.thinking && t >= TTT.thinkAt) {
    TTT.thinking = false;
    tttAiMove();
  }
}

function drawPipes() {

      g.addColorStop(0.5, "#9be78e"); g.addColorStop(0.82, "#4fae54");

      ctx.fillStyle = "rgba(255,255,255,0.26)"; ctx.fillRect(p.x + 15, y, 9, h);
      ctx.fillStyle = "rgba(0,0,0,0.16)"; ctx.fillRect(p.x + PIPE_W - 20, y, 8, h);

      ctx.strokeStyle = "rgba(20,60,22,0.55)"; ctx.lineWidth = 2.5;

        ctx.beginPath();
        ctx.moveTo(cx, cy + 20); ctx.lineTo(cx - 5, cy + 14); ctx.lineTo(cx + 5, cy + 14); ctx.fill();
      }
    };
    if (p.smashed) {
      const piece = (h, y, hgt, capTop) => {
        if (hgt <= 0) return;
        ctx.save();
        const pivX = p.x + PIPE_W / 2, pivY = y + hgt / 2;
        ctx.translate(pivX + h.dx, pivY + h.dy);
        ctx.rotate(h.rot);

        ctx.globalAlpha = 0.97;
        segment(y, hgt, capTop);

      piece(p.half.bot, botTop, groundY - botTop, true);

    } else {
      ctx.fillStyle = th.dots;
      ctx.beginPath(); ctx.arc(s.x, wy, th.particleMode === "snow" ? s.s * 1.5 : s.s, 0, 7); ctx.fill();
    }
  }
}
function drawMutedBadge() {
  if (!muted) return;
  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.fillStyle = "rgba(20,40,60,0.5)"; rr(W - 46, 14, 32, 32, 9); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = '18px sans-serif'; ctx.textAlign = "center";
  ctx.fillText("🔇", W - 30, 37);
  ctx.restore();
}

/* ================= MAIN LOOP ================= */
let last = performance.now();
function drawPaused() {
  ctx.fillStyle = "rgba(6,12,28,0.72)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#fff";
  ctx.font = "bold 44px system-ui, sans-serif";
  ctx.fillText("PAUSED", W / 2, H / 2 - 12);
  ctx.font = "18px system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,.8)";
  ctx.fillText("Tap or press any key to resume", W / 2, H / 2 + 26);
  ctx.textAlign = "left";
}
function hubPause() { if (state === "play") { hubPaused = true; } }
function hubResume() { if (hubPaused) { hubPaused = false; last = performance.now(); return true; } return false; }
document.addEventListener("visibilitychange", () => { if (document.hidden) hubPause(); });
window.addEventListener("blur", hubPause);
window.__flappy = {
  setMuted(m) { muted = !!m; },
  get speedT() { return spdT; },
  get timeLeft() { return timeLeft; },
  get smashes() { return smashes; },
  get mode() { return realistic ? "real" : "normal"; },
  _orb(type) { powerups.push({ x: bird.x + 24, y: bird.y, type: type || "speed", ph: 0 }); },
  get paused() { return hubPaused; },
  get muted() { return muted; },
  get score() { return score; },
  get best() { return best; },
  get state() { return state; },
  get scene() { return scene; },
  dkDebug() {
    const g = dk.gates.find(g2 => !g2.scored && g2.rimX1 + 40 > dk.ball.x);
    return { st: dk.st, score: dk.score, combo: dk.combo, reason: dk.reason,
             bx: dk.ball.x, by: dk.ball.y, vy: dk.ball.vy,
             rim: g ? { x0: g.rimX0, x1: g.rimX1, y: g.rimY, bx: g.x } : null };
  }
};
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (!hubPaused) update(dt);

  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

  if (scene === "dunky") {
    ctx.clearRect(0, 0, W, H);
    drawSky();
    for (const c of clouds) drawCloud(c.x, c.y, c.s);
    drawMountains();
    drawHills();
    drawSeeds();
    drawCourt();
    drawDunkyGatesBack();
    drawDunkyFlames();
    for (let i = 2; i >= 1; i--) {
      ctx.globalAlpha = 0.10;
      drawDunkyBall(dk.ball.x - dk.speed * 0.014 * i, dk.ball.y, dk.ball.r, dk.rot - i * 0.4);
      ctx.globalAlpha = 1;
    }
    drawDunkyBall(dk.ball.x, dk.ball.y, dk.ball.r, dk.rot);
    drawDunkyGatesFront();
    drawScorePops();
    if (dk.st === "play") drawDunkyHUD();
    if (dk.st === "ready") drawDunkyReady();
    if (dk.st === "over") drawDunkyPanel();
  } else {
  drawSky();
  for (const c of clouds) drawCloud(c.x, c.y, c.s);
  drawMountains();
  drawHills();
  drawSeeds();
  drawPowerups();
  drawPipes();
  drawDebris();
  drawGround();
  drawScorePops();
  drawBird();
  drawBadges();
  if (state === "play" || state === "dying") drawBigScore();
  if (realistic && (state === "play" || state === "dying")) drawRealHUD();
  if (state === "ready") drawReady();
  if (state === "over") drawPanel();
  }
  drawMutedBadge();
  if (state === "board") drawBoardOverlay();
  if (state === "ttt") drawTTT();
  if (state === "shop") drawShop();

  if (slowT > 0 && (state === "play" || state === "dying")) {
    ctx.fillStyle = "rgba(90,60,200,0.06)";
    ctx.fillRect(0, 0, W, H);
  }
  if (spdT > 0 && (state === "play" || state === "dying")) {
    ctx.fillStyle = "rgba(0,200,140,0.05)";
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 2;
    for (let i = 0; i < 7; i++) {
      const ly = (i * 97 + (t * 900) % 97) % H;
      ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(W, ly - 18); ctx.stroke();
    }
  }
  if (flashA > 0) { ctx.fillStyle = `rgba(255,255,255,${flashA})`; ctx.fillRect(0, 0, W, H); }
  if (hubPaused) drawPaused();
  ctx.restore();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
