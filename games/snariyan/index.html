<!doctype html>
<html lang="en">
<head>
<script src="../../js/sound-guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snariyan</title>
<style>
  html,body{margin:0;height:100%;background:#dff0d6;color:#4e7a52;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  #top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font-weight:800;font-size:20px}
  #cv{flex:1;width:100%;display:block}
  .ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(223,240,214,.88)}
  .ov.on{display:flex}
  .panel{background:#f4fbf0;border:4px solid #4e7a52;border-radius:24px;padding:22px;text-align:center;width:min(86%,320px);box-shadow:0 10px 0 rgba(78,122,82,.2)}
  h1{margin:0 0 8px;font-size:30px}
  p{margin:8px 0;line-height:1.4}
  .btn{display:block;width:100%;margin-top:10px;padding:14px;border-radius:18px;border:3px solid #4e7a52;background:#b7e3a6;color:#2f5a35;font:700 20px system-ui,sans-serif;box-shadow:0 5px 0 rgba(78,122,82,.35);cursor:pointer}
  .btn.ghost{background:#f4fbf0}
  .btn.online{background:#ffd98e;border-color:#b5832a;color:#6b4a0d}
  .btn{transition:transform .1s,box-shadow .1s}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(78,122,82,.35)}
  #raceRes{list-style:none;padding:0;margin:8px 0 0;text-align:left}
  #raceRes li{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:6px;border-radius:12px;background:#e6f4de;border:2px solid #b9d9ab;font-weight:700}
  #raceRes li span:last-child{margin-left:auto}
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><span id="score" data-testid="snake-score">Score: 0</span><span id="best" data-testid="snake-best">Best: 0</span></div>
  <canvas id="cv"></canvas>
</div>

<div class="ov on" id="pStart">
  <div class="panel">
    <h1>Snariyan</h1>
    <p>Ariyan is the snake. Eat Amaan to grow longer.</p>
    <p>Don't hit the walls or your own tail. Swipe, or use the arrow keys / WASD.</p>
    <button class="btn" id="bPlay" data-testid="snake-play-button">Play</button>
    <button class="btn online" id="bOnline" data-testid="snake-online-button">🌐 Snariyan Race (online 1v1)</button>
    <button class="btn ghost" id="bHub">Back to the hub</button>
  </div>
</div>

<div class="ov" id="pOver">
  <div class="panel">
    <h1 id="oTitle">Game over</h1>
    <p id="oSub"></p>
    <button class="btn" id="bAgain">Play again</button>
    <button class="btn" id="bShare" style="background:#ffd98e">📤 Share score</button>
    <button class="btn ghost" id="bHub2">Back to the hub</button>
  </div>
</div>

<div class="ov" id="pRace">
  <div class="panel">
    <h1 id="rTitle" data-testid="race-result-title">Race over</h1>
    <p id="rSub" data-testid="race-result-sub"></p>
    <ul id="raceRes" data-testid="race-results"></ul>
    <button class="btn" id="rAgain" data-testid="race-rematch-button">Rematch</button>
    <p id="rWait" style="display:none;font-size:14px" data-testid="race-wait-text">Waiting for the host to start a rematch…</p>
    <button class="btn ghost" id="rLeave" data-testid="race-leave-button">Leave room</button>
  </div>
</div>

<script src="../../js/hub-online.js"></script>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var N = 20;                       /* the board is N x N cells */
  var W = 0, H = 0, DPR = 1, cell = 20, ox = 0, oy = 0;
  var state = 'title';

  var headImg = new Image(); headImg.src = 'ariyan.png';
  var appleImg = new Image(); appleImg.src = 'amaan.png';
  var boardImg = new Image(); boardImg.src = 'haider.png'; /* board background; drawn only once it has loaded */

  /* ---------- storage (safe if blocked) ---------- */
  function ls(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var best = Number(ls('snariyanBest', 0)) || 0;

  /* ---------- game state ---------- */
  var snake = [], dir = { x: 1, y: 0 }, queued = [], apple = { x: 0, y: 0 };
  var eaten = 0, speed = 150, acc = 0, last = 0;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cell = race ? Math.max(8, (Math.min(W, H) - 6) / N) : Math.floor(Math.min(W, H) / N);
    ox = Math.floor((W - cell * N) / 2);
    oy = Math.floor((H - cell * N) / 2);
  }
  window.addEventListener('resize', resize);

  function placeApple() {
    var x, y, tries = 0;
    do {
      x = Math.floor(Math.random() * N); y = Math.floor(Math.random() * N); tries++;
    } while (tries < 500 && snake.some(function (s) { return s.x === x && s.y === y; }));
    apple = { x: x, y: y };
  }

  function resetGame() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 }; queued = [];
    eaten = 0; speed = 150; acc = 0;
    placeApple();
    updateHUD();
  }

  function updateHUD() {
    document.getElementById('score').textContent = 'Score: ' + eaten;
    document.getElementById('best').textContent = 'Best: ' + best;
  }

  function show(id, on) { document.getElementById(id).classList.toggle('on', on); }

  function startGame() {
    resetGame();
    state = 'play';
    show('pStart', false); show('pOver', false);
  }

  function gameOver() {
    state = 'over';
    if (eaten > best) { best = eaten; save('snariyanBest', String(best)); }
    /* every finished run pays hub XP and counts towards the hub level */
    save('snariyanXP', (Number(ls('snariyanXP', 0)) || 0) + eaten * 5);
    save('snariyanPlays', (Number(ls('snariyanPlays', 0)) || 0) + 1);
    updateHUD();
    document.getElementById('oTitle').textContent = eaten > 0 ? 'Nice one!' : 'Ouch!';
    document.getElementById('oSub').textContent = 'You grew by ' + eaten + (eaten === 1 ? ' piece.' : ' pieces.') + ' Best: ' + best + '.';
    setTimeout(function () { show('pOver', true); }, 350);
  }

  /* ---------- one move ---------- */
  function step() {
    if (queued.length) dir = queued.shift();
    var hx = snake[0].x + dir.x, hy = snake[0].y + dir.y;

    if (hx < 0 || hy < 0 || hx >= N || hy >= N) { gameOver(); return; }
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === hx && snake[i].y === hy) { gameOver(); return; }
    }

    snake.unshift({ x: hx, y: hy });
    if (hx === apple.x && hy === apple.y) {
      eaten++;
      speed = Math.max(70, speed - 5);
      if (eaten > best) { best = eaten; save('snariyanBest', String(best)); }
      placeApple();
      updateHUD();
    } else {
      snake.pop();
    }
  }

  /* ---------- steering ---------- */
  function turn(dx, dy) {
    if (race) { raceTurn(dx, dy); return; }
    if (state !== 'play') return;
    var ref = queued.length ? queued[queued.length - 1] : dir;
    if (dx === ref.x && dy === ref.y) return;      /* same way already */
    if (dx === -ref.x && dy === -ref.y) return;    /* no reversing into yourself */
    if (queued.length < 3) queued.push({ x: dx, y: dy });
  }

  window.addEventListener('keydown', function (e) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') turn(0, -1);
    else if (k === 'ArrowDown' || k === 's' || k === 'S') turn(0, 1);
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') turn(-1, 0);
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') turn(1, 0);
    else return;
    e.preventDefault();
  });

  /* the hub play page forwards game keys here when this iframe is not focused */
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (!d.hubKey) return;
    window.dispatchEvent(new KeyboardEvent('keydown', { code: d.hubKey, key: d.key || d.hubKey, bubbles: true, cancelable: true }));
  });

  var sx = 0, sy = 0, swiping = false;
  cv.addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; swiping = true; });
  cv.addEventListener('pointerup', function (e) {
    if (!swiping) return; swiping = false;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;   /* a tap is not a swipe */
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
  });

  /* ---------- drawing ---------- */
  function cx(x) { return ox + x * cell + cell / 2; }
  function cy(y) { return oy + y * cell + cell / 2; }

  function drawCircleImage(img, x, y, r, ringColour, ringWidth) {
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.closePath();
    ctx.clip();
    if (img.complete && img.naturalWidth) ctx.drawImage(img, x - r, y - r, r * 2, r * 2);
    else { ctx.fillStyle = '#9ac48b'; ctx.fill(); }
    ctx.restore();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.lineWidth = ringWidth; ctx.strokeStyle = ringColour; ctx.stroke();
  }

  function draw() {
    if (race) { drawRace(); return; }
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#dff0d6'; ctx.fillRect(0, 0, W, H);

    /* board */
    var bw = cell * N, bh = cell * N;
    if (boardImg.complete && boardImg.naturalWidth) {
      var sc = Math.max(bw / boardImg.naturalWidth, bh / boardImg.naturalHeight);
      var dw = boardImg.naturalWidth * sc, dh = boardImg.naturalHeight * sc;
      ctx.drawImage(boardImg, ox + (bw - dw) / 2, oy + (bh - dh) / 2, dw, dh);
    } else {
      ctx.fillStyle = '#e9f6e2'; ctx.fillRect(ox, oy, bw, bh);
    }
    ctx.fillStyle = 'rgba(233,246,226,0.28)';   /* soften the photo so the snake reads clearly */
    ctx.fillRect(ox, oy, bw, bh);
    ctx.strokeStyle = 'rgba(78,122,82,.12)'; ctx.lineWidth = 1;
    for (var i = 1; i < N; i++) {
      ctx.beginPath(); ctx.moveTo(ox + i * cell, oy); ctx.lineTo(ox + i * cell, oy + cell * N); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ox, oy + i * cell); ctx.lineTo(ox + cell * N, oy + i * cell); ctx.stroke();
    }
    ctx.strokeStyle = '#4e7a52'; ctx.lineWidth = 3;
    ctx.strokeRect(ox, oy, cell * N, cell * N);

    /* apple = Amaan */
    drawCircleImage(appleImg, cx(apple.x), cy(apple.y), cell * 0.5, '#d9534f', 3);

    /* body, drawn tail first so the head sits on top */
    for (var j = snake.length - 1; j >= 1; j--) {
      var s = snake[j];
      drawCircleImage(headImg, cx(s.x), cy(s.y), cell * 0.42, '#4e7a52', 2.5);
    }

    /* head = Ariyan */
    if (snake.length) {
      drawCircleImage(headImg, cx(snake[0].x), cy(snake[0].y), cell * 0.55, '#4e7a52', 3);
    }
  }

  /* ---------- loop ---------- */
  function frame(t) {
    var dt = last ? Math.min(100, t - last) : 0;
    last = t;
    if (race && race.phase === 'count' && !raceRoom.isHost && t >= race.goAt) race.phase = 'play';
    if (state === 'play') {
      acc += dt;
      while (acc >= speed && state === 'play') { acc -= speed; step(); }
    }
    draw();
    requestAnimationFrame(frame);
  }

  /* ---------- share card (like Flappy's) ---------- */
  function buildCard() {
    var c = document.createElement('canvas');
    c.width = 640; c.height = 800;
    var x = c.getContext('2d');

    var g = x.createLinearGradient(0, 0, 0, 800);
    g.addColorStop(0, '#e8f7de'); g.addColorStop(0.55, '#c9ecbd'); g.addColorStop(1, '#a5d995');
    x.fillStyle = g; x.fillRect(0, 0, 640, 800);

    /* faint board grid */
    x.strokeStyle = 'rgba(78,122,82,.16)'; x.lineWidth = 2;
    for (var i = 0; i <= 12; i++) {
      x.beginPath(); x.moveTo(40 + i * 46, 60); x.lineTo(40 + i * 46, 660); x.stroke();
      x.beginPath(); x.moveTo(40, 60 + i * 46); x.lineTo(592, 60 + i * 46); x.stroke();
    }

    /* the snake: a zig-zag of Ariyan heads with the biggest on top */
    function face(fx, fy, r) {
      x.save();
      x.beginPath(); x.arc(fx, fy, r, 0, Math.PI * 2); x.closePath(); x.clip();
      if (headImg.complete && headImg.naturalWidth) x.drawImage(headImg, fx - r, fy - r, r * 2, r * 2);
      else { x.fillStyle = '#9ac48b'; x.fill(); }
      x.restore();
      x.beginPath(); x.arc(fx, fy, r, 0, Math.PI * 2);
      x.lineWidth = Math.max(5, r * 0.14); x.strokeStyle = '#4e7a52'; x.stroke();
    }
    var pts = [[120, 560], [250, 608], [380, 560], [520, 610], [520, 420], [380, 372], [250, 420], [140, 360]];
    for (var p = 0; p < pts.length; p++) face(pts[p][0], pts[p][1], 44);
    face(320, 240, 86);

    /* Amaan apple */
    x.save();
    x.beginPath(); x.arc(560, 150, 52, 0, Math.PI * 2); x.closePath(); x.clip();
    if (appleImg.complete && appleImg.naturalWidth) x.drawImage(appleImg, 508, 98, 104, 104);
    else { x.fillStyle = '#d9534f'; x.fill(); }
    x.restore();
    x.beginPath(); x.arc(560, 150, 52, 0, Math.PI * 2); x.lineWidth = 8; x.strokeStyle = '#d9534f'; x.stroke();

    x.textAlign = 'center';
    x.fillStyle = 'rgba(47,90,53,.8)';
    x.font = 'bold 30px "Trebuchet MS", sans-serif';
    x.fillText('SNARIYAN 🐍', 320, 82);
    var who = '';
    try { who = JSON.parse(localStorage.getItem('gamehub-profile-v1') || '{}').name || ''; } catch (e) {}
    if (who) {
      x.font = 'bold 19px "Trebuchet MS", sans-serif';
      x.fillStyle = 'rgba(47,90,53,.62)';
      x.fillText(who + ' · BEST ' + best, 320, 112);
    } else {
      x.font = 'bold 19px "Trebuchet MS", sans-serif';
      x.fillStyle = 'rgba(47,90,53,.62)';
      x.fillText('BEST ' + best, 320, 112);
    }

    x.fillStyle = '#2f5a35';
    x.font = 'bold 150px "Trebuchet MS", sans-serif';
    x.fillText(String(eaten), 320, 714);
    x.font = 'bold 24px "Trebuchet MS", sans-serif';
    x.fillText(eaten === 1 ? 'AMAAN EATEN' : 'AMAANS EATEN', 320, 758);
    x.font = '16px "Trebuchet MS", sans-serif';
    x.fillText('The Game Hub', 320, 784);
    return c;
  }

  function shareScore() {
    var card = buildCard();
    var text = 'My snake ate ' + eaten + ' Amaan' + (eaten === 1 ? '' : 's') + ' in Snariyan on The Game Hub!';
    card.toBlob(function (blob) {
      if (!blob) return;
      var file = new File([blob], 'snariyan-score.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], text: text, title: 'Snariyan' }).catch(function () {});
        return;
      }
      if (navigator.share) { navigator.share({ text: text, url: location.href }).catch(function () {}); return; }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'snariyan-score.png';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }, 'image/png');
  }

  /* ---------- Snariyan Race: online 1v1 on one shared board ----------
     The host runs the simulation and broadcasts the board every tick; the guest only
     sends turns. Each snake has its own apple (ringed in its colour). Eat yours to grow;
     eat your rival's to steal the point AND drop a stone block near their head.
     Crash into a wall, a block or any snake and you lose. First to 15 also wins. */
  var race = null, raceRoom = null, raceTally = [0, 0, 0];
  var RC = ['#2e8b57', '#e67e22'], RTICK = 140, RWIN = 15;
  function rInit(data) {
    return {
      ids: data.ids, names: data.names, round: data.round,
      snakes: [
        { b: [{ x: 4, y: 5 }, { x: 3, y: 5 }, { x: 2, y: 5 }], d: { x: 1, y: 0 }, q: [], alive: true, sc: 0 },
        { b: [{ x: 15, y: 14 }, { x: 16, y: 14 }, { x: 17, y: 14 }], d: { x: -1, y: 0 }, q: [], alive: true, sc: 0 }
      ],
      apples: [], blocks: [], over: false, winner: -2, phase: 'count', goAt: performance.now() + 3000, timer: 0, seq: 0
    };
  }
  function rFree(x, y) {
    if (x < 0 || y < 0 || x >= N || y >= N) return false;
    var i, j;
    for (i = 0; i < race.snakes.length; i++) for (j = 0; j < race.snakes[i].b.length; j++) if (race.snakes[i].b[j].x === x && race.snakes[i].b[j].y === y) return false;
    for (i = 0; i < race.apples.length; i++) if (race.apples[i] && race.apples[i].x === x && race.apples[i].y === y) return false;
    for (i = 0; i < race.blocks.length; i++) if (race.blocks[i].x === x && race.blocks[i].y === y) return false;
    return true;
  }
  function rPlaceApple(o) {
    var x, y, t = 0;
    do { x = Math.floor(Math.random() * N); y = Math.floor(Math.random() * N); t++; } while (t < 800 && !rFree(x, y));
    race.apples[o] = { x: x, y: y, o: o };
  }
  function rDropBlock(victim) {
    var s = race.snakes[victim], h = s.b[0], tries = 0;
    while (tries++ < 300) {
      var x = h.x + Math.floor(Math.random() * 11) - 5, y = h.y + Math.floor(Math.random() * 11) - 5;
      var dist = Math.abs(x - h.x) + Math.abs(y - h.y);
      if (dist < 3 || dist > 6) continue;
      /* never drop it right in front of their nose — that would be an instant, unfair crash */
      var ahead = false;
      for (var k = 1; k <= 3; k++) if (x === h.x + s.d.x * k && y === h.y + s.d.y * k) ahead = true;
      if (ahead || !rFree(x, y)) continue;
      race.blocks.push({ x: x, y: y });
      return;
    }
  }
  function rStep() {
    var S = race.snakes, heads = [], i, j;
    for (i = 0; i < 2; i++) {
      var sn = S[i];
      if (!sn.alive) { heads.push(null); continue; }
      if (sn.q.length) sn.d = sn.q.shift();
      heads.push({ x: sn.b[0].x + sn.d.x, y: sn.b[0].y + sn.d.y });
    }
    var eat = [-1, -1];
    for (i = 0; i < 2; i++) {
      if (!heads[i]) continue;
      for (j = 0; j < 2; j++) if (race.apples[j] && race.apples[j].x === heads[i].x && race.apples[j].y === heads[i].y) eat[i] = j;
    }
    if (eat[0] !== -1 && eat[0] === eat[1]) eat[1] = -1;
    for (i = 0; i < 2; i++) {
      if (!heads[i]) continue;
      S[i].b.unshift(heads[i]);
      if (eat[i] === -1) S[i].b.pop();
    }
    var dead = [false, false];
    for (i = 0; i < 2; i++) {
      var h = heads[i]; if (!h) continue;
      if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N) { dead[i] = true; continue; }
      for (j = 0; j < race.blocks.length; j++) if (race.blocks[j].x === h.x && race.blocks[j].y === h.y) dead[i] = true;
      for (var k = 0; k < 2; k++) for (j = (k === i ? 1 : 0); j < S[k].b.length; j++) if (S[k].b[j].x === h.x && S[k].b[j].y === h.y) dead[i] = true;
    }
    for (i = 0; i < 2; i++) {
      if (eat[i] === -1 || dead[i]) continue;
      S[i].sc++;
      var o = eat[i];
      if (o !== i) rDropBlock(o);
      rPlaceApple(o);
    }
    for (i = 0; i < 2; i++) if (dead[i]) S[i].alive = false;
    race.seq++;
    var w = -2;
    if (dead[0] && dead[1]) w = -1;
    else if (dead[0]) w = 1;
    else if (dead[1]) w = 0;
    else if (S[0].sc >= RWIN || S[1].sc >= RWIN) w = S[0].sc === S[1].sc ? -1 : (S[0].sc > S[1].sc ? 0 : 1);
    if (w !== -2) { race.over = true; race.winner = w; }
  }
  function rPack() {
    return { r: race.round, n: race.seq, iv: Math.max(95, RTICK - (race.snakes[0].sc + race.snakes[1].sc) * 2), s: race.snakes.map(function (s) { var f = []; for (var k = 0; k < s.b.length; k++) f.push(s.b[k].x, s.b[k].y); return { f: f, a: s.alive ? 1 : 0, c: s.sc, d: [s.d.x, s.d.y] }; }),
      ap: race.apples, bl: race.blocks, ov: race.over, w: race.winner };
  }
  function rHostTick() {
    if (!race || !raceRoom || race.over) return;
    rStep();
    raceRoom.send('st', rPack());
    raceHUD();
    if (race.over) { raceEnd(); return; }
    var total = race.snakes[0].sc + race.snakes[1].sc;
    race.iv = Math.max(95, RTICK - total * 2); race.stAt = performance.now();
    race.timer = setTimeout(rHostTick, race.iv);
  }
  function raceTurn(dx, dy) {
    if (!race || race.over || race.phase === 'done') return;
    var me = race.me, sn = race.snakes[me];
    if (!sn.alive) return;
    if (raceRoom.isHost) {
      rQueue(sn, dx, dy);
    } else {
      var ref = sn.lastSent || sn.d;
      if ((dx === ref.x && dy === ref.y) || (dx === -ref.x && dy === -ref.y)) return;
      sn.lastSent = { x: dx, y: dy };
      raceRoom.send('dir', { r: race.round, x: dx, y: dy });
    }
  }
  function rQueue(sn, dx, dy) {
    var ref = sn.q.length ? sn.q[sn.q.length - 1] : sn.d;
    if (dx === ref.x && dy === ref.y) return;
    if (dx === -ref.x && dy === -ref.y) return;
    if (sn.q.length < 3) sn.q.push({ x: dx, y: dy });
  }
  function raceHUD() {
    if (!race) return;
    var me = race.me, op = 1 - me;
    document.getElementById('score').textContent = 'You ' + race.snakes[me].sc + ' – ' + race.snakes[op].sc + ' ' + (race.names[race.ids[op]] || 'Rival');
    document.getElementById('best').textContent = 'Room ' + raceRoom.code + ' · first to ' + RWIN;
  }
  function raceEnd() {
    if (!race || race.phase === 'done') return;
    race.phase = 'done';
    clearTimeout(race.timer);
    var me = race.me, w = race.winner;
    if (w === -1) raceTally[2]++; else raceTally[w === me ? 0 : 1]++;
    save('snariyanXP', (Number(ls('snariyanXP', 0)) || 0) + race.snakes[me].sc * 5 + (w === me ? 40 : 0));
    save('snariyanPlays', (Number(ls('snariyanPlays', 0)) || 0) + 1);
    if (raceRoom) raceRoom.endMatch();
    var opName = race.names[race.ids[1 - me]] || 'Rival';
    document.getElementById('rTitle').textContent = w === -1 ? "It's a draw!" : (w === me ? 'You win! 🏆' : opName + ' wins!');
    document.getElementById('rSub').textContent = race.leftMsg || (w === -1 ? 'Head to head — nobody survives.' :
      (race.snakes[w === me ? 1 - me : me].alive ? 'First to ' + RWIN + ' Amaans!' : (w === me ? opName + ' crashed.' : 'You crashed.')));
    document.getElementById('raceRes').innerHTML = [me, 1 - me].map(function (i) {
      return '<li><span style="width:12px;height:12px;border-radius:50%;background:' + RC[i] + '"></span><span>' +
        (i === me ? 'You' : String(opName).replace(/[&<>]/g, '')) + '</span><span>' + race.snakes[i].sc + ' 🍎</span></li>';
    }).join('') + '<li><span>Series</span><span>You ' + raceTally[0] + ' – ' + raceTally[1] + (raceTally[2] ? ' · draws ' + raceTally[2] : '') + '</span></li>';
    var host = raceRoom && raceRoom.isHost;
    document.getElementById('rAgain').style.display = raceRoom ? '' : 'none';
    document.getElementById('rAgain').textContent = host ? 'Rematch' : 'Ask for a rematch';
    document.getElementById('rWait').style.display = 'none';
    setTimeout(function () { if (race && race.phase === 'done') show('pRace', true); }, 700);
  }
  function raceBind(room) {
    if (room.__sn) return; room.__sn = true;
    room.on('st', function (d) {
      if (!race || raceRoom !== room || room.isHost || d.r !== race.round || d.n <= race.seq) return;
      race.seq = d.n;
      for (var i = 0; i < 2; i++) {
        var s = race.snakes[i];
        var ds = d.s[i];
        if (ds.f) { var nb = []; for (var k = 0; k + 1 < ds.f.length; k += 2) nb.push({ x: ds.f[k], y: ds.f[k + 1] }); s.b = nb; s.d = { x: ds.d[0], y: ds.d[1] }; }
        else { s.b = ds.b; s.d = ds.d; }
        s.alive = !!ds.a; s.sc = ds.c;
        if (i === race.me && s.lastSent && s.d.x === s.lastSent.x && s.d.y === s.lastSent.y) s.lastSent = null;
      }
      race.apples = d.ap; race.blocks = d.bl;
      var nowT = performance.now();
      if (race.stAt) { var gap = nowT - race.stAt; if (gap > 40 && gap < 400) race.iv = race.iv ? race.iv * 0.7 + gap * 0.3 : gap; }
      if (d.iv && !race.iv) race.iv = d.iv;
      race.stAt = nowT;
      if (d.n > 0 && race.phase === 'count') race.phase = 'play';
      raceHUD();
      if (d.ov) { race.over = true; race.winner = d.w; raceEnd(); }
    });
    room.on('dir', function (d) {
      if (!race || raceRoom !== room || !room.isHost || d.r !== race.round) return;
      rQueue(race.snakes[1 - race.me], d.x, d.y);
    });
    room.on('rematch', function () { if (room.isHost && race && race.phase === 'done') room.startMatch(); });
    room.on('left', function (p) {
      if (!race || raceRoom !== room || race.ids.indexOf(p.id) === -1 || race.phase === 'done') return;
      race.over = true; race.winner = race.me; race.leftMsg = p.name + ' left the race.';
      raceEnd();
    });
  }
  function raceStart(room, data) {
    raceBind(room);
    if (raceRoom !== room) raceTally = [0, 0, 0];
    if (race) clearTimeout(race.timer);
    raceRoom = room;
    race = rInit(data);
    race.me = data.ids[0] === room.me ? 0 : 1;
    resize();
    rPlaceApple(0); rPlaceApple(1);
    if (!room.isHost) { race.apples = []; race.seq = -1; }   /* the guest waits for the host's board */
    state = 'race';
    show('pStart', false); show('pOver', false); show('pRace', false);
    raceHUD();
    if (room.isHost) {
      room.send('st', Object.assign(rPack(), { n: 0 }));
      race.timer = setTimeout(function () { if (race) { race.phase = 'play'; rHostTick(); } }, 3000);
    }
  }
  function raceStop() {
    if (race) clearTimeout(race.timer);
    race = null; raceRoom = null; raceTally = [0, 0, 0];
    resize();
    show('pRace', false);
    state = 'title'; resetGame();
  }
  function drawBlock(x, y) {
    var px = ox + x * cell, py = oy + y * cell, m = Math.max(1, cell * 0.06);
    ctx.fillStyle = '#7d8a80'; ctx.fillRect(px + m, py + m, cell - 2 * m, cell - 2 * m);
    ctx.fillStyle = '#9aa79c'; ctx.fillRect(px + m, py + m, cell - 2 * m, (cell - 2 * m) * 0.35);
    ctx.strokeStyle = '#3f4a42'; ctx.lineWidth = 2; ctx.strokeRect(px + m, py + m, cell - 2 * m, cell - 2 * m);
  }
  function drawRace() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#dff0d6'; ctx.fillRect(0, 0, W, H);
    var bw = cell * N;
    if (boardImg.complete && boardImg.naturalWidth) {
      var sc = Math.max(bw / boardImg.naturalWidth, bw / boardImg.naturalHeight);
      var dw = boardImg.naturalWidth * sc, dh = boardImg.naturalHeight * sc;
      ctx.save(); ctx.beginPath(); ctx.rect(ox, oy, bw, bw); ctx.clip();
      ctx.drawImage(boardImg, ox + (bw - dw) / 2, oy + (bw - dh) / 2, dw, dh); ctx.restore();
    } else { ctx.fillStyle = '#e9f6e2'; ctx.fillRect(ox, oy, bw, bw); }
    ctx.fillStyle = 'rgba(244,251,240,0.62)'; ctx.fillRect(ox, oy, bw, bw);
    ctx.fillStyle = 'rgba(78,122,82,0.07)';
    for (var gy = 0; gy < N; gy++) for (var gx = (gy % 2); gx < N; gx += 2) ctx.fillRect(ox + gx * cell, oy + gy * cell, cell, cell);
    ctx.strokeStyle = 'rgba(78,122,82,.16)'; ctx.lineWidth = 1;
    for (var gl = 1; gl < N; gl++) {
      ctx.beginPath(); ctx.moveTo(ox + gl * cell, oy); ctx.lineTo(ox + gl * cell, oy + bw); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ox, oy + gl * cell); ctx.lineTo(ox + bw, oy + gl * cell); ctx.stroke();
    }
    ctx.strokeStyle = '#2f5a35'; ctx.lineWidth = 4; ctx.strokeRect(ox, oy, bw, bw);
    if (!race) return;
    race.blocks.forEach(function (b) { drawBlock(b.x, b.y); });
    race.apples.forEach(function (a, i) { if (a) drawCircleImage(appleImg, cx(a.x), cy(a.y), cell * 0.5, RC[i], 4); });
    var nowD = performance.now(), iv = race.iv || RTICK;
    var fr = (race.phase === 'play' && !race.over && race.stAt) ? Math.max(0, Math.min(1, (nowD - race.stAt) / iv)) : 0;
    for (var i = 0; i < 2; i++) {
      var s = race.snakes[i];
      if (!s.b.length) continue;
      var dr = s.d;
      if (raceRoom && raceRoom.isHost && s.q && s.q.length) dr = s.q[0];
      else if (i === race.me && s.lastSent) dr = s.lastSent;
      var f = s.alive ? fr : 0;
      var hx = s.b[0].x + dr.x * f, hy0 = s.b[0].y + dr.y * f;
      if (hx < -0.4 || hy0 < -0.4 || hx > N - 0.6 || hy0 > N - 0.6) { f = 0; hx = s.b[0].x; hy0 = s.b[0].y; }
      var pts = [{ x: hx, y: hy0 }];
      for (var j = 1; j < s.b.length; j++) pts.push({ x: s.b[j].x + (s.b[j - 1].x - s.b[j].x) * f, y: s.b[j].y + (s.b[j - 1].y - s.b[j].y) * f });
      ctx.globalAlpha = s.alive ? 1 : 0.4;
      ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = RC[i]; ctx.lineWidth = cell * 0.7; ctx.globalAlpha *= 0.55;
      ctx.beginPath(); ctx.moveTo(cx(pts[0].x), cy(pts[0].y));
      for (j = 1; j < pts.length; j++) ctx.lineTo(cx(pts[j].x), cy(pts[j].y));
      ctx.stroke(); ctx.restore();
      for (j = pts.length - 1; j >= 1; j--) drawCircleImage(headImg, cx(pts[j].x), cy(pts[j].y), cell * 0.42, RC[i], 3);
      drawCircleImage(headImg, cx(pts[0].x), cy(pts[0].y), cell * 0.58, RC[i], 4);
      ctx.globalAlpha = 1;
      ctx.save(); ctx.textAlign = 'center'; ctx.font = '800 ' + Math.max(11, cell * 0.55) + 'px system-ui,sans-serif';
      ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
      var label = i === race.me ? 'YOU' : (race.names[race.ids[i]] || '').slice(0, 8);
      var hy = cy(pts[0].y) - cell * 0.8;
      if (hy < oy + 8) hy = cy(pts[0].y) + cell * 1.3;
      ctx.strokeText(label, cx(pts[0].x), hy); ctx.fillStyle = RC[i]; ctx.fillText(label, cx(pts[0].x), hy);
      ctx.restore();
    }
    if (race.phase === 'count') {
      var left = Math.ceil((race.goAt - performance.now()) / 1000);
      ctx.save(); ctx.textAlign = 'center'; ctx.lineJoin = 'round';
      ctx.fillStyle = 'rgba(244,251,240,.85)'; ctx.fillRect(ox, oy + bw * 0.32, bw, bw * 0.3);
      ctx.font = '900 ' + Math.round(cell * 3) + 'px system-ui,sans-serif';
      ctx.fillStyle = '#2f5a35'; ctx.fillText(left > 0 ? String(left) : 'GO!', ox + bw / 2, oy + bw * 0.5);
      ctx.font = '800 ' + Math.round(cell * 0.8) + 'px system-ui,sans-serif';
      ctx.fillStyle = RC[race.me];
      ctx.fillText('You are the ' + (race.me === 0 ? 'GREEN' : 'ORANGE') + ' snake · eat your ' + (race.me === 0 ? 'green' : 'orange') + ' apples', ox + bw / 2, oy + bw * 0.58);
      ctx.restore();
    }
  }
  function openRaceLobby() {
    if (!window.HubOnline) { alert('Online play needs an internet connection.'); return; }
    show('pStart', false); show('pOver', false);
    HubOnline.openLobby({
      game: 'snariyan', title: 'Snariyan Race', min: 2, max: 2,
      theme: { bg: 'rgba(223,240,214,.9)', panel: '#f4fbf0', border: '#4e7a52', text: '#2f5a35', title: '#2f5a35', input: '#ffffff',
        accent: '#b7e3a6', accentText: '#2f5a35', shadow: 'rgba(78,122,82,.45)', ring: 'rgba(78,122,82,.3)', warn: '#c0392b', ok: '#2e8b57' },
      onStart: raceStart,
      onEnd: function () { if (race || raceRoom) raceStop(); },
      onClose: function () { show('pStart', true); }
    });
  }
  document.getElementById('bOnline').onclick = openRaceLobby;
  document.getElementById('rAgain').onclick = function () {
    if (!raceRoom) return;
    if (raceRoom.isHost) raceRoom.startMatch();
    else { raceRoom.send('rematch', {}); document.getElementById('rWait').style.display = ''; }
  };
  document.getElementById('rLeave').onclick = function () {
    raceStop();
    if (window.HubOnline) HubOnline.leave();
    show('pStart', true);
  };
  window.__race = function () { return race ? { phase: race.phase, me: race.me, seq: race.seq, over: race.over, winner: race.winner,
    scores: [race.snakes[0].sc, race.snakes[1].sc], heads: race.snakes.map(function (s) { return s.b[0]; }), blocks: race.blocks.length } : null; };

  /* ---------- buttons ---------- */
  function goHub() {
    try { if (window.parent && window.parent !== window) { window.parent.location.href = '../../index.html'; return; } } catch (e) {}
    location.href = '../../index.html';
  }
  document.getElementById('bPlay').onclick = startGame;
  document.getElementById('bAgain').onclick = startGame;
  document.getElementById('bShare').onclick = shareScore;
  document.getElementById('bHub').onclick = goHub;
  document.getElementById('bHub2').onclick = goHub;

  resize();
  resetGame();
  updateHUD();
  requestAnimationFrame(frame);
})();
</script>
